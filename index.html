<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lindenhaus Apps</title>
<meta name="description" content="Lindenhaus Player – a fast TV and video player for Android.">
<style>
  :root { --bg: #0E1116; --surface: #161B22; --text: #E8EEF2; --dim: #9AA6B2; --accent: #2FB6A3; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #F4F1EA; --surface: #FFFFFF; --text: #1B2127; --dim: #5B6670; --accent: #138A7A; } }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; padding: 40px 16px; }
  main { max-width: 520px; width: 100%; background: var(--surface); border-radius: 22px; padding: 28px 22px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 8px 0 6px; } p { color: var(--dim); margin: 6px 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Lindenhaus Player</h1>
  <p>A fast TV and video player for Android phones, foldables, tablets, TV boxes and Chromebooks.</p>
  <p>No account with us, no tracking, nothing sent to us.</p>
  <p><a href="https://play.google.com/store/apps/details?id=de.lindenhausapps.player">Google Play</a></p>
</main>
</body>
</html>
