<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080A">
<title>Pawprint · Lindenhaus Player</title>
<meta name="description" content="A tip or a cinema ticket from a friend, sent with Lindenhaus Player.">
<!--
  Static landing page for pawprint links and paper tickets' codes. No server logic, no cookies, no trackers, no external
  fonts. The tip itself sits in the part of the address after "#", which browsers never send to any server; it is decoded
  right here in the browser. Loaded from elsewhere: the optional poster (Wikipedia) and the official store badges (Apple,
  Google) – all without a referrer. The look is the app's (19 Nov 2026, Nathan: "the design of the target page has to be
  updated … apple store has to be inserted too … could you make it more attractive so everybody understands the page?").
-->
<style>
  :root {
    --bg: #07080A; --glass: rgba(255,255,255,.055); --edge: rgba(255,255,255,.12); --text: #F4F1E8; --dim: #A9A39A;
    --red: #E5432D; --gold: #C9A35B; --cream: #FFF1D2; --paper: #F6E7C8; --ink: #2A1B0A; --paperRed: #8A1F1A; --cat: #F29B38;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.5 Jost, Futura, "Century Gothic", "Avenir Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center; padding: 18px 16px 36px;
    background: radial-gradient(ellipse 70% 45% at 50% 0%, rgba(229,131,45,.16), transparent 70%), var(--bg);
  }
  main { width: 100%; max-width: 460px; }
  /* the brand line */
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2px 0 16px; }
  .brand svg { width: 46px; height: 46px; }
  .brand b { font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase; color: var(--cream); font-weight: 600; }
  .brand small { display: block; color: var(--dim); font-size: .72rem; letter-spacing: .04em; text-transform: none; font-weight: 400; }
  /* a tip: glass */
  .card { background: var(--glass); border: 1px solid var(--edge); border-radius: 22px; padding: 20px 18px 18px; backdrop-filter: blur(8px); }
  .poster { display: none; width: 58%; margin: 2px auto 14px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  .poster.on { display: block; }
  h1 { font-size: 1.3rem; line-height: 1.3; margin: 4px 0 8px; text-align: center; font-weight: 600; }
  .note { font-style: italic; text-align: center; margin: 6px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--cream); }
  .spoiler { display: block; margin: 8px auto; border: 1px dashed var(--dim); background: transparent; color: var(--dim); border-radius: 12px; padding: 8px 12px; font: inherit; cursor: pointer; }
  .list { list-style: none; padding: 0; margin: 10px 0 0; }
  .list li { background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 12px; margin: 6px 0; overflow-wrap: anywhere; }
  .meta { text-align: center; color: var(--dim); font-size: .85rem; margin: 2px 0 0; }
  .empty { text-align: center; color: var(--dim); }
  /* a cinema ticket: paper, like the one printed */
  .ticket { display: none; position: relative; background: var(--paper); color: var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.2); transform: rotate(-1.2deg); margin: 6px 4px 4px; }
  .ticket.on { display: block; }
  .band { background: var(--paperRed); color: var(--cream); text-align: center; font-weight: 700; letter-spacing: .32em; font-size: .78rem; padding: 7px 0 6px; }
  .tbody { display: flex; gap: 14px; padding: 14px 14px 12px; }
  .tposter { flex: 0 0 34%; aspect-ratio: 2/3; border-radius: 6px; background: #2b2118 center/cover no-repeat; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
  .tposter svg { width: 70%; opacity: .9; }
  .tinfo { flex: 1; min-width: 0; }
  .lab { font-size: .62rem; letter-spacing: .18em; color: #7a5a35; font-weight: 700; text-transform: uppercase; }
  .ttitle { font-size: 1.15rem; line-height: 1.2; font-weight: 700; margin: 1px 0 8px; overflow-wrap: anywhere; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .grid div b { display: block; font-size: 1.02rem; }
  .perf { position: relative; border-top: 2px dashed rgba(42,27,10,.35); margin: 0 14px; }
  .ticket::before, .ticket::after { content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); bottom: 44px; }
  .ticket::before { left: -11px; } .ticket::after { right: -11px; }
  .stub { display: flex; justify-content: space-between; align-items: center; padding: 9px 16px 11px; font-size: .8rem; color: #5b4120; }
  .stub b { color: var(--paperRed); letter-spacing: .1em; }
  .from { text-align: center; color: var(--cream); margin: 18px 0 2px; font-size: 1.05rem; }
  /* what to do */
  .steps { list-style: none; counter-reset: s; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
  .steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; background: var(--glass); border: 1px solid var(--edge); border-radius: 14px; padding: 11px 12px; font-size: .93rem; }
  .steps li::before { content: counter(s); flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .85rem; }
  .actions { display: grid; gap: 12px; margin-top: 20px; }
  .btn { display: block; text-align: center; text-decoration: none; font-weight: 600; border-radius: 999px; padding: 14px 18px; color: #fff; background: var(--red); box-shadow: 0 6px 20px rgba(229,67,45,.35); }
  .stores { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  .stores a { display: inline-flex; align-items: center; justify-content: center; height: 54px; }
  .stores img { height: 54px; width: auto; display: block; }
  .stores img.gp { height: 80px; margin: -13px -10px; }     /* Google's badge carries its own clear space */
  .stores .txt { height: 54px; padding: 0 18px; border-radius: 12px; background: #000; border: 1px solid #a6a6a6; color: #fff; text-decoration: none; font-weight: 600; font-size: .92rem; }
  .hint { color: var(--dim); font-size: .85rem; text-align: center; margin: 12px 4px 0; }
  footer { color: var(--dim); font-size: .76rem; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <!-- our own box cat in its medallion (the app's logo family: dark enamel, gold ring) -->
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <defs><radialGradient id="en" cx="24" cy="18" r="31" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2A1E14"/><stop offset="1" stop-color="#0D0907"/></radialGradient></defs>
      <circle cx="24" cy="24" r="23" fill="url(#en)"/><circle cx="24" cy="24" r="23" fill="none" stroke="#C9A35B" stroke-width="1.2"/>
      <path d="M15.6 24 V15.6 L20 18.6 Q24 17.4 28 18.6 L32.4 15.6 V24" fill="none" stroke="#FFF1D2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20.8" cy="21.6" r="1.25" fill="#FFF1D2"/><circle cx="27.2" cy="21.6" r="1.25" fill="#FFF1D2"/>
      <path d="M12 24 H36 V36.5 A2.5 2.5 0 0 1 33.5 39 H14.5 A2.5 2.5 0 0 1 12 36.5 Z M12 24 L8 20.6 M36 24 L40 20.6" fill="none" stroke="#FFF1D2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 35.2 C19 31.6 19.5 27.6 22 27.4 C23.2 27.3 23.8 28.1 24 28.7 C24.2 28.1 24.8 27.3 26 27.4 C28.5 27.6 29 31.6 24 35.2 Z" fill="#E5432D"/>
    </svg>
    <div><b>Lindenhaus Player</b><small id="tagline"></small></div>
  </div>

  <!-- 🎟 a cinema ticket, drawn like the paper one -->
  <div class="ticket" id="ticket">
    <div class="band" id="band">ADMIT ONE</div>
    <div class="tbody">
      <div class="tposter" id="tposter">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15.6 24 V15.6 L20 18.6 Q24 17.4 28 18.6 L32.4 15.6 V24 M12 24 H36 V36.5 A2.5 2.5 0 0 1 33.5 39 H14.5 A2.5 2.5 0 0 1 12 36.5 Z" fill="none" stroke="#F6E7C8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="tinfo">
        <div class="lab" id="lFilm">Film</div><div class="ttitle" id="tTitle"></div>
        <div class="grid">
          <div><span class="lab" id="lDate">Date</span><b id="tDate">—</b></div>
          <div><span class="lab" id="lStart">Starts</span><b id="tStart">—</b></div>
          <div><span class="lab" id="lRow">Row</span><b id="tRow">—</b></div>
          <div><span class="lab" id="lSeat">Seat</span><b id="tSeat">—</b></div>
        </div>
      </div>
    </div>
    <div class="perf"></div>
    <div class="stub"><span id="tFrom"></span><b>LINDENHAUS</b></div>
  </div>

  <!-- 🐾 a tip -->
  <div class="card" id="card">
    <img class="poster" id="poster" alt="">
    <div id="content"><p class="empty" id="loading">…</p></div>
  </div>

  <ol class="steps" id="steps"></ol>
  <div class="actions" id="actions"></div>
  <p class="hint" id="hint"></p>
  <footer id="footer"></footer>
</main>
<script>
(function () {
  "use strict";
  var PKG = "de.lindenhausapps.player";
  var APPLE = "https://apps.apple.com/app/id6832089602";
  var de = (navigator.language || "en").toLowerCase().indexOf("de") === 0;
  if (de) document.documentElement.lang = "de";
  var T = de ? {
    tagline: "Dein Kino zu Hause – auf iPhone, iPad, Android und TV",
    tip: "Ein Pfotenabdruck für dich", from: "{0} schickt dir einen Pfotenabdruck",
    ticketFrom: "{0} schenkt dir eine Kinokarte 🎟", ticket: "Eine Kinokarte für dich 🎟", fromStub: "von {0}",
    admit: "EINLASS", film: "Film", date: "Datum", start: "Beginn", row: "Reihe", seat: "Platz", any: "frei wählbar",
    watch: "Schau dir „{0}“ an!", live: "{0} läuft gerade – schalt ein!",
    basket: "Ein Korb mit {0} Tipps", basketFrom: "{0} schickt dir einen Korb mit {1} Tipps",
    purr: "{0} hat auf deinen Tipp „{1}“ reagiert", someone: "Jemand",
    clip: "Ein Clip für dich", clipFrom: "{0} schickt dir einen Clip", watchClip: "▶ Clip ansehen",
    spoiler: "🙈 Spoiler – zum Lesen tippen", open: "In Lindenhaus Player öffnen",
    s1: "Hol dir Lindenhaus Player – kostenlos für iPhone, iPad, Android-Handys, Tablets und TV-Boxen.",
    s2t: "Tippe auf „In Lindenhaus Player öffnen“ – die Karte liegt dann bei deinen Tickets.",
    s3t: "Bring die Karte mit – auf Papier oder auf dem Handy. An der Tür wird sie gescannt, und los geht's. 🍿",
    s2: "Tippe auf „In Lindenhaus Player öffnen“ – der Tipp hängt dann an deiner Pinnwand.",
    s3: "Schau ihn bei deinem eigenen TV-Anbieter – Gratis-TV klappt sofort, ganz ohne Login.",
    appleTxt: "Laden im App Store", googleTxt: "Jetzt bei Google Play",
    broken: "Dieser Link ist unvollständig. Bitte lass ihn dir noch einmal schicken.",
    old: "Dein Browser ist zu alt, um diesen Pfotenabdruck zu lesen. Öffne den Link am besten direkt in der App.",
    footer: "Diese Seite speichert nichts und sendet deinen Tipp nirgendwohin. Das Filmbild kommt von Wikipedia, die Store-Zeichen von Apple und Google."
  } : {
    tagline: "Your cinema at home – on iPhone, iPad, Android and TV",
    tip: "A pawprint for you", from: "{0} sent you a pawprint",
    ticketFrom: "{0} gives you a cinema ticket 🎟", ticket: "A cinema ticket for you 🎟", fromStub: "from {0}",
    admit: "ADMIT ONE", film: "Film", date: "Date", start: "Starts", row: "Row", seat: "Seat", any: "any night",
    watch: "Watch “{0}”!", live: "{0} is on right now – tune in!",
    basket: "A basket of {0} tips", basketFrom: "{0} sent you a basket of {1} tips",
    purr: "{0} reacted to your tip “{1}”", someone: "A friend",
    clip: "A clip for you", clipFrom: "{0} sent you a clip", watchClip: "▶ Watch the clip",
    spoiler: "🙈 Spoiler – tap to read", open: "Open in Lindenhaus Player",
    s1: "Get Lindenhaus Player – free for iPhone, iPad, Android phones, tablets and TV boxes.",
    s2t: "Tap “Open in Lindenhaus Player” – the ticket goes into your tickets.",
    s3t: "Bring the ticket along – on paper or on your phone. It is scanned at the door, and the film begins. 🍿",
    s2: "Tap “Open in Lindenhaus Player” – the tip lands on your pinboard.",
    s3: "Watch it with your own TV provider – free TV works right away, no login needed.",
    appleTxt: "Download on the App Store", googleTxt: "Get it on Google Play",
    broken: "This link is incomplete. Please ask your friend to send it again.",
    old: "Your browser is too old to read this pawprint. Best open the link directly in the app.",
    footer: "This page stores nothing and sends your tip nowhere. The film picture comes from Wikipedia, the store badges from Apple and Google."
  };
  var EMOJI = { love: "😻", funny: "😹", wow: "🙀", meh: "😾" };
  function f(s) { var a = arguments; return s.replace(/\{(\d)\}/g, function (_, i) { return a[+i + 1]; }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function $(id) { return document.getElementById(id); }

  var code = (location.hash || "").replace(/^#/, "");
  var content = $("content");
  $("tagline").textContent = T.tagline;
  $("footer").textContent = T.footer;
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /android/i.test(ua);

  function playUrl() {
    var ref = code && code.length < 1500 ? "&referrer=" + encodeURIComponent("paw=" + encodeURIComponent(code)) : "";
    return "https://play.google.com/store/apps/details?id=" + PKG + ref;
  }
  // the official badges (Apple's and Google's own pictures, in the page's language); words in a black pill if one does not load
  function badge(href, src, alt, cls) {
    var a = el("a"); a.href = href; a.rel = "noopener"; a.setAttribute("aria-label", alt);
    var img = el("img", cls); img.src = src; img.alt = alt; img.referrerPolicy = "no-referrer";
    img.onerror = function () { var t = el("a", "txt", alt); t.href = href; t.rel = "noopener"; a.replaceWith(t); };
    a.appendChild(img); return a;
  }
  function buttons(ticket) {
    var actions = $("actions");
    if (code && (android || ios)) {
      var a = el("a", "btn", T.open);
      a.href = android
        ? "intent://paw?d=" + encodeURIComponent(code) + "#Intent;scheme=lindenhaus;package=" + PKG + ";S.browser_fallback_url=" + encodeURIComponent(playUrl()) + ";end"
        : "lindenhaus://paw?d=" + encodeURIComponent(code);
      actions.appendChild(a);
    }
    var stores = el("div", "stores");
    var apple = badge(APPLE, "https://tools.applemarketingtools.com/api/badges/download-on-the-app-store/black/" + (de ? "de-de" : "en-us") + "?size=250x83", T.appleTxt, "as");
    var google = badge(playUrl(), "https://play.google.com/intl/en_us/badges/static/images/badges/" + (de ? "de" : "en") + "_badge_web_generic.png", T.googleTxt, "gp");
    // the store of the device in hand first; both everywhere else
    if (android) { stores.appendChild(google); stores.appendChild(apple); } else { stores.appendChild(apple); stores.appendChild(google); }
    actions.appendChild(stores);
    var steps = $("steps");
    [T.s1, ticket ? T.s2t : T.s2, ticket ? T.s3t : T.s3].forEach(function (t) { steps.appendChild(el("li", null, t)); });
  }

  function showTicket(p, title, year, from, tk, nightMin) {
    $("card").style.display = "none";
    $("ticket").className = "ticket on";
    $("band").textContent = T.admit + " · " + T.admit;
    $("lFilm").textContent = T.film; $("lDate").textContent = T.date; $("lStart").textContent = T.start; $("lRow").textContent = T.row; $("lSeat").textContent = T.seat;
    $("tTitle").textContent = title + (year ? " (" + year + ")" : "");
    $("tRow").textContent = tk[0]; $("tSeat").textContent = tk[1];
    if (nightMin > 0) {
      try {
        var d = new Date(nightMin * 60000);
        $("tDate").textContent = d.toLocaleDateString(de ? "de-DE" : undefined, { weekday: "short", day: "numeric", month: "short" });
        $("tStart").textContent = d.toLocaleTimeString(de ? "de-DE" : undefined, { hour: "2-digit", minute: "2-digit" });
      } catch (e) {}
    } else { $("tDate").textContent = T.any; }
    $("tFrom").textContent = from ? f(T.fromStub, from) : "";
    var h = el("p", "from", from ? f(T.ticketFrom, from) : T.ticket);
    $("ticket").insertAdjacentElement("afterend", h);
    if (p.m) { var n = el("p", "note", "“" + String(p.m).slice(0, 280) + "”"); h.insertAdjacentElement("afterend", n); }
    if (title) poster(title, year, "movie", function (src) { var tp = $("tposter"); tp.textContent = ""; tp.style.backgroundImage = "url('" + src + "')"; });
  }

  function show(p) {
    content.textContent = "";
    var title = String(p.n || "").slice(0, 120), from = p.f ? String(p.f).slice(0, 40) : null;
    var year = /^\d{4}$/.test(p.y || "") ? p.y : null;
    // 🎟 a paper ticket's code: the ticket, the film night and the seat (facts "tk" and "night", the app's Meow.kt)
    var x = (p.x && typeof p.x === "object") ? p.x : {};
    var tk = /^\d{1,2}-\d{1,2}$/.test(String(x.tk || "")) ? String(x.tk).split("-") : null;
    var nightMin = /^\d{1,9}$/.test(String(x.night || "")) ? +x.night : 0;
    if (tk) { showTicket(p, title, year, from, tk, nightMin); return true; }
    var head;
    if (p.t === "live") head = (from ? f(T.from, from) + " · " : "") + f(T.live, title);
    else if (p.t === "list") head = from ? f(T.basketFrom, from, (p.l || []).length) : f(T.basket, (p.l || []).length);
    else if (p.t === "clip") head = from ? f(T.clipFrom, from) : T.clip;
    else if (p.t === "purr") head = (EMOJI[p.r] || "🐾") + " " + f(T.purr, from || T.someone, title);
    else head = (from ? f(T.from, from) : T.tip) + ": " + f(T.watch, title + (year ? " (" + year + ")" : ""));
    content.appendChild(el("h1", null, head));
    if (p.m) {
      var note = el("p", "note", "“" + String(p.m).slice(0, 280) + "”");
      if (p.s === 1 || p.s === "1") {
        var b = el("button", "spoiler", T.spoiler);
        b.onclick = function () { b.replaceWith(note); };
        content.appendChild(b);
      } else content.appendChild(note);
    }
    if (p.t === "list" && Array.isArray(p.l)) {
      var ul = el("ul", "list");
      p.l.slice(0, 50).forEach(function (it) {
        ul.appendChild(el("li", null, String(it.n || "").slice(0, 120) + (/^\d{4}$/.test(it.y || "") ? " (" + it.y + ")" : "")));
      });
      content.appendChild(ul);
    }
    if (p.t === "clip" && typeof p.c === "string") {
      try {
        var cu = new URL(p.c);
        var ok = cu.protocol === "https:" && /^(www\.|m\.|vm\.|vt\.)?(tiktok\.com|youtube\.com|instagram\.com)$|^youtu\.be$|^bsky\.app$/.test(cu.hostname);
        if (ok) { var a = el("a", "btn", T.watchClip); a.href = cu.href; a.rel = "noopener noreferrer"; a.style.marginTop = "12px"; content.appendChild(a); }
      } catch (e) {}
    }
    if (p.d) {
      try { content.appendChild(el("p", "meta", new Date(p.d * 1000).toLocaleDateString(de ? "de-DE" : undefined, { day: "numeric", month: "long", year: "numeric" }))); } catch (e) {}
    }
    if ((p.t === "movie" || p.t === "series") && title) poster(title, year, p.t, function (src) {
      var img = $("poster"); img.src = src; img.alt = title; img.onload = function () { img.className = "poster on"; };
    });
    return false;
  }

  function poster(title, year, type, done) {
    var lang = de ? "de" : "en";
    var hint = type === "series" ? (de ? "Fernsehserie" : "TV series") : (de ? "Film" : "film");
    var q = encodeURIComponent(title + (year ? " " + year : "") + " " + hint);
    fetch("https://" + lang + ".wikipedia.org/w/api.php?action=query&list=search&format=json&srlimit=1&origin=*&srsearch=" + q, { referrerPolicy: "no-referrer" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var t = j && j.query && j.query.search && j.query.search[0] && j.query.search[0].title;
        if (!t) return null;
        return fetch("https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t.replace(/ /g, "_")), { referrerPolicy: "no-referrer" }).then(function (r) { return r.json(); });
      })
      .then(function (s) {
        var src = s && s.thumbnail && s.thumbnail.source;
        if (src && /^https:\/\/upload\.wikimedia\.org\//.test(src)) done(src);
      })
      .catch(function () {});
  }

  function decode(c) {
    if (!c || c.charAt(0) !== "1" || c.length > 12000) return Promise.reject(new Error("bad"));
    if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("old"));
    var b64 = c.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text().then(function (t) {
      if (t.length > 65536) throw new Error("bad");
      return JSON.parse(t);
    });
  }

  decode(code).then(function (p) {
    if (!p || typeof p !== "object" || ["movie", "series", "live", "list", "purr", "clip"].indexOf(p.t) < 0) throw new Error("bad");
    buttons(show(p));
  }).catch(function (e) {
    content.textContent = "";
    content.appendChild(el("p", "empty", e && e.message === "old" ? T.old : T.broken));
    buttons(false);
  });
})();
</script>
</body>
